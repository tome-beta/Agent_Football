<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soccer Simulation - 3vs3</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      min-height: 100vh;
      flex-wrap: wrap;
    }
    #game {
      border: 2px solid #333;
      background-color: #fff;
      display: block;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #controls {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 12px 16px;
      width: 300px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      font-size: 13px;
    }
    #controls h2 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    #controls .buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #controls button {
      flex: 1;
      padding: 6px 8px;
      cursor: pointer;
    }
    #controls .role-group {
      border-top: 1px solid #eee;
      padding-top: 8px;
      margin-top: 8px;
    }
    #controls .role-group h3 {
      font-size: 13px;
      margin: 0 0 6px;
    }
    #controls .param-row {
      display: grid;
      grid-template-columns: 90px 1fr 34px;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    #controls .param-row label {
      color: #444;
    }
    #controls .param-row output {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #controls .hint {
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }
    #controls .debug-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid #eee;
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- 論理サイズ 75m(横) x 50m(縦) のピッチ（ゴールが左右）を 8px/m で描画する想定。
       実際のサイズは CanvasRenderer.init() が GameConfig から設定し直す。 -->
  <canvas id="game" width="600" height="400"></canvas>

  <div id="controls">
    <h2>試合コントロール</h2>
    <div class="buttons">
      <button id="toggleBtn" type="button">一時停止</button>
      <button id="speedBtn" type="button">0.5倍速にする</button>
      <button id="restartBtn" type="button">パラメータを適用して再スタート</button>
    </div>
    <div id="role-groups"></div>
    <p class="hint">
      スライダーは役割(FW/MF/DF)ごとの選手パラメータ。変更は「再スタート」を押すまで反映されません（試合中の選手には即時反映しません）。
    </p>
    <label class="debug-toggle">
      <input type="checkbox" id="debugVisionToggle" />
      選手の視野範囲を表示（デバッグ用）
    </label>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
